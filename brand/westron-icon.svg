<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand hero treatment: radial purple glow, center 50% 35% (guide §Logo) -->
    <radialGradient id="bg" cx="512" cy="358" r="840" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1653"/>
      <stop offset="1" stop-color="#0B0C14"/>
    </radialGradient>
    <!-- Mark gradient: #7C5CFF → #C9B8FF, left to right -->
    <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#C9B8FF"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  </g>
  <rect x="0.75" y="0.75" width="1022.5" height="1022.5" rx="224.25" ry="224.25" fill="none" stroke="#F2F2F7" stroke-opacity="0.10" stroke-width="1.5"/>
  <!-- brand mark: 72x64 path scaled ~6.67x, centred -->
  <g transform="translate(272,300) scale(6.67)">
    <path d="M6 22 L18 46 L30 22 L42 46 L56 20 L64 28"
          stroke="url(#wg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="64" cy="28" r="3.5" fill="#C9B8FF"/>
  </g>
</svg>
