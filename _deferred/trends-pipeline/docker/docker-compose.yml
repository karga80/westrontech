services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: westron
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: trends
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U westron -d trends"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  xmcp:
    build:
      context: ../services/xmcp
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ../services/xmcp/.env
    depends_on:
      - redis

volumes:
  pg_data:
  redis_data:
