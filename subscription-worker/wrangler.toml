name = "westron-subscription"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Public config — payment address and prices
# Run `wrangler deploy` after setting secrets below
[vars]
PAYMENT_WALLET    = "0xYOUR_PAYMENT_WALLET_ADDRESS"
MONTHLY_PRICE_ETH = "0.01"
ANNUAL_PRICE_ETH  = "0.09"
PRICE_TOLERANCE   = "0.20"

# Secrets — set via CLI before deploying:
#   wrangler secret put ALCHEMY_WEBHOOK_SECRET
